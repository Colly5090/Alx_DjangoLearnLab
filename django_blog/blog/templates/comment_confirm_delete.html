{% extends 'base.html' %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Delete Comment</h2>

    <p>Are you sure you want to delete this comment?</p>
    <p><strong>"{{ object.content }}"</strong></p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-submit">Yes, Delete</button>
        <a href="{% url 'post-detail' object.post.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
