{% extends 'base.html' %}

{% block title %}Search Results{% endblock %}

{% block content %}
<h1>Search Results</h1>

{% for post in posts %}
    <div>
        <h2><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.content|truncatewords:25 }}</p>
    </div>
{% empty %}
    <p>No posts match your search.</p>
{% endfor %}
{% endblock %}
